services:
  mobile:
    build:
      context: .
    ports:
      - "8081:8081"
    environment:
      EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL:-https://e-teacher.onrender.com/api/}"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${REACT_NATIVE_PACKAGER_HOSTNAME:-127.0.0.1}"
    volumes:
      - ./frontend:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  mobile_node_modules:
